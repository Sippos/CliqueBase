<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cliquebase</title>
    <style>
      a[aria-label="CliqueBase global Explore"] {
        display: inline-flex !important;
        align-items: center !important;
        gap: 0.75rem !important;
      }

      .navbar-cliquebase-logo {
        display: block !important;
        width: 3.5rem !important;
        height: 3.5rem !important;
        flex: 0 0 3.5rem !important;
        border-radius: 1rem !important;
        object-fit: contain !important;
        padding: 0.35rem !important;
        background: #111 !important;
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14), 0 0 20px rgb(255 255 255 / 0.18) !important;
      }

      @media (max-width: 640px) {
        .navbar-cliquebase-logo {
          width: 3rem !important;
          height: 3rem !important;
          flex-basis: 3rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const logoSrc = '/cliquebase-logo-mark.svg?v=4'

        function ensureNavbarLogo() {
          const brandLink = document.querySelector('a[aria-label="CliqueBase global Explore"]')
          if (!brandLink || brandLink.querySelector('.navbar-cliquebase-logo')) return

          const logo = document.createElement('img')
          logo.src = logoSrc
          logo.alt = 'CliqueBase logo'
          logo.className = 'navbar-cliquebase-logo'
          logo.width = 56
          logo.height = 56
          logo.decoding = 'async'

          brandLink.prepend(logo)
        }

        const root = document.getElementById('root')
        ensureNavbarLogo()
        if (root) {
          new MutationObserver(ensureNavbarLogo).observe(root, { childList: true, subtree: true })
        }
      })()
    </script>
  </body>
</html>
